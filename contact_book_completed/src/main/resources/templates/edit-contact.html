<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Contact - Contact Book</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <div class="container nav">
        <a class="brand" th:href="@{/contacts}">📒 Contact Book</a>
        <a class="btn btn-secondary" th:href="@{/contacts}">← Back</a>
    </div>
</header>

<main class="container narrow">
    <section class="card form-card">
        <p class="eyebrow">UPDATE CONTACT</p>
        <h1>Edit Contact</h1>
        <p class="subtitle">Update the contact details below.</p>

        <form th:action="@{/contacts/update/{id}(id=${contact.id})}" th:object="${contact}" method="post">
            <div class="form-group">
                <label for="name">Name *</label>
                <input id="name" type="text" th:field="*{name}" placeholder="Enter full name">
                <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>

            <div class="form-group">
                <label for="phone">Phone *</label>
                <input id="phone" type="text" th:field="*{phone}" placeholder="Enter phone number">
                <p class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input id="email" type="email" th:field="*{email}" placeholder="Enter email address">
                <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" th:field="*{address}" rows="3" placeholder="Enter address"></textarea>
                <p class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
            </div>

            <div class="form-actions">
                <a class="btn btn-secondary" th:href="@{/contacts}">Cancel</a>
                <button class="btn btn-primary" type="submit">Update Contact</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
